<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Component</title>
</head>
<body>
  
  <h1>Динамически загружаемый веб-компонент</h1>
  <div id="app"></div>
  
  <script>
    const components = ["my-select", "my-panel"];
    const onLoad = (event) => {
      const scriptElement = event.target;
      const componentName = scriptElement.dataset.name;
      const app = document.getElementById("app");
      
      if (componentName === "my-panel") {
        app.innerHTML = `
          <my-panel header="Настройки фильтра" subheader="Выберите нужные опции" toggleable>
            <my-select>
              <option value="opt1">Option 1</option>
              <option value="opt2">Option 2</option>
              <option value="opt3">Option 3</option>
            </my-select>
          </my-panel>
        `;
      }
    };
    const onError = (error) => {
      console.error("Ошибка загрузки скрипта:", error);
    };
    components.forEach((component) => {
      const script = document.createElement("script");
      script.src = `./${component}.js`;
      script.dataset.name = component;
      script.addEventListener("load", onLoad);
      script.addEventListener("error", onError);
      document.body.append(script);
    });
  </script>
</body>
</html>
