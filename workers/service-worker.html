<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сервис-воркер</title>
  <style>
    @keyframes spinner {
      0% {
        transform: scale(.1) rotate(0deg);
        fill: currentColor;
      }
      33% {
        transform: scale(1) rotate(150deg);
        fill: transparent;
      }
      66% {
        transform: scale(1) rotate(210deg);
        fill: transparent;
      }
      100% {
        transform: scale(.1) rotate(360deg);
        fill: currentColor;
      }
    }

    .spinner {
      animation: spinner 1.5s infinite linear;
      color: rgb(6, 75, 67);
    }
  </style>
</head>
<body>

  <button id="start">Запустить</button>
  <button id="unregister">Удалить сервис-воркер</button>
  <div>
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" fill="none" class="spinner"><path stroke="currentColor" stroke-width="4" d="M3.464 30a4 4 0 0 1 0-4L16 4.287a4 4 0 0 1 3.464-2h25.072a4 4 0 0 1 3.464 2L60.536 26a4 4 0 0 1 0 4L48 51.713a4 4 0 0 1-3.464 2H19.464a4 4 0 0 1-3.464-2L3.464 30Z"/></svg>
  </div>
  <div id="result"></div>

  <script>
    const MSG = {
      GET_CACHED: "GET_CACHED",
      RECALCULATE: "RECALCULATE"
    };

    const getServiceWorker = async (scriptURL, options) => {
      if ("serviceWorker" in navigator) {
        try {
          let registration = await navigator.serviceWorker.getRegistration();
          if (!registration) {
            registration = await navigator.serviceWorker.register(scriptURL, options);
            await navigator.serviceWorker.ready;
          }
          return {
            registration,
            container: navigator.serviceWorker,
            controller: registration.active,
            addEventListener: navigator.serviceWorker.addEventListener.bind(navigator.serviceWorker),
            postMessage: registration.active.postMessage.bind(registration.active)
          };
        } catch (error) {
          console.error(`Ошибка регистрации: ${error}`);
        }
      }
    };

    (async () => {
      const serviceWorker = await getServiceWorker("./service-worker.js", { scope: "./" });
      if (!serviceWorker) return;

      serviceWorker.addEventListener("message", (evt) => {
        const { type, payload } = evt.data;
        if (type === "RESULT") {
          document.getElementById("result").textContent = payload;
        }
      });

      serviceWorker.postMessage({
        type: MSG.GET_CACHED,
        payload: { timeout: 3000 }
      });

      document.getElementById("start").addEventListener("click", () => {
        serviceWorker.postMessage({
          type: MSG.RECALCULATE,
          payload: { timeout: 3000 }
        });
      });

      document.getElementById("unregister").addEventListener("click", async () => {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) {
          await reg.unregister();
          console.log("Сервис-воркер удален");
        }
      });
    })();
  </script>
</body>
</html>
